<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="ストライプ柄 PATTERN-002">
  <!-- PATTERN-002 ストライプ(斜めの細い線) -->
  <!-- 主要色: #334155 / 濃さは fill-opacity で調整 / 線幅2・間隔14・傾き45度 -->
  <!-- 再利用: 下記 <pattern> をCSS/SVGにコピーして敷く。傾きは patternTransform の rotate 値で変更 -->
  <defs>
    <pattern id="pattern-002" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="2" height="14" fill="#334155" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="240" height="120" fill="url(#pattern-002)"/>
</svg>
