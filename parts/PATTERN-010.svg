<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="菱形格子柄 PATTERN-010">
  <!-- PATTERN-010 菱形格子(ダイヤの格子) -->
  <!-- 主要色: #334155 / 濃さは stroke-opacity で調整 / 線幅1・タイル24x24 -->
  <!-- 再利用: 下記 <pattern> をCSS/SVGにコピー、または本ファイルを background-size:24px 24px; background-repeat:repeat で敷く -->
  <defs>
    <pattern id="pattern-010" width="24" height="24" patternUnits="userSpaceOnUse">
      <polygon points="12,1 23,12 12,23 1,12" fill="none" stroke="#334155" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="240" height="120" fill="url(#pattern-010)"/>
</svg>
