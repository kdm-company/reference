<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="縦ストライプ柄 PATTERN-005">
  <!-- PATTERN-005 縦ストライプ(垂直の細い線) -->
  <!-- 主要色: #334155 / 濃さは fill-opacity で調整 / 線幅2・間隔14 -->
  <!-- 再利用: 下記 <pattern> をCSS/SVGにコピー、または本ファイルを background-size:14px 14px; background-repeat:repeat で敷く -->
  <defs>
    <pattern id="pattern-005" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="14" fill="#334155" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="240" height="120" fill="url(#pattern-005)"/>
</svg>
