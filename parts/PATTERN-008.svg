<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="三角柄 PATTERN-008">
  <!-- PATTERN-008 三角(上向きの三角を敷き詰め) -->
  <!-- 主要色: #334155 / 濃さは fill-opacity で調整 / タイル22x22 -->
  <!-- 再利用: 下記 <pattern> をCSS/SVGにコピー、または本ファイルを background-size:22px 22px; background-repeat:repeat で敷く -->
  <defs>
    <pattern id="pattern-008" width="22" height="22" patternUnits="userSpaceOnUse">
      <polygon points="11,3 19,18 3,18" fill="#334155" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="240" height="120" fill="url(#pattern-008)"/>
</svg>
