<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="シェブロン柄 PATTERN-006">
  <!-- PATTERN-006 シェブロン(山形のジグザグ) -->
  <!-- 主要色: #334155 / 濃さは stroke-opacity で調整 / 線幅2・タイル24x12 -->
  <!-- 再利用: 下記 <pattern> をCSS/SVGにコピーして敷く -->
  <defs>
    <pattern id="pattern-006" width="24" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L6 0 L12 12 L18 0 L24 12" fill="none" stroke="#334155" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="240" height="120" fill="url(#pattern-006)"/>
</svg>
