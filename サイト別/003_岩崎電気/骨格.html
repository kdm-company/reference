<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>003 岩崎電気 形の骨格</title>
<!--
  形(レイアウト構造)だけのスケルトン。色・テキスト・実画像は除去。
  元URL: https://www.iwasaki.co.jp/
  含む形:
    DECO-003 / 英語ラベル+下線見出しのテキストブロック(セクション見出しの型)
    LAYOUT-003 / テキスト左・画像右を交互に組む濃色背景セクション
    DECO-004 / スクロール時に出る固定ヘッダー(白・横長・ロゴ左+メニュー右+ハンバーガー+検索)
    DECO-005 / 放射状グロー背景(左上から差す光。radial-gradientで描くCSSコード。写真ではない)
  ※ DECO-005の確認: 中心から外周へ均一に減衰する楕円グラデ。ノイズ・色ムラがなくHTMLに画像要素もないためCSS背景と判定。
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:sans-serif;color:#999;background:#fff;}
  .ph{background:#e6e6e6;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;text-align:center;}
  .label{max-width:1200px;margin:40px auto 8px;padding:0 32px;font-size:13px;color:#3a6ea5;font-weight:700;}

  /* ===== DECO-004 固定ヘッダー(スクロール時) ===== */
  .fixed-header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;border-bottom:1px solid #eee;background:#fff;}
  .fixed-header .left{display:flex;align-items:center;gap:18px;}
  .fixed-header .logo{width:180px;height:30px;}
  .fixed-header .lang{width:54px;height:24px;border-radius:14px;}   /* 言語トグル(丸み) */
  .fixed-header .right{display:flex;align-items:center;gap:26px;}
  .fixed-header .right .it{width:70px;height:13px;}
  .fixed-header .right .icon{width:24px;height:18px;}               /* ハンバーガー/検索 */

  /* ===== 濃色背景セクション + DECO-005 放射状グロー ===== */
  /* 濃紺ベースに、左上寄りから差す光をradial-gradientで重ねる(これがDECO-005の正体)。
     base: 濃紺  /  glow: 中心明るい青→透明へ減衰する楕円 */
  .dark{
    position:relative;
    background:#0d1f47;                           /* 濃紺ベース */
    padding:70px 0;
    overflow:hidden;
  }
  .dark::before{                                   /* DECO-005 グロー本体 */
    content:"";
    position:absolute;
    top:-10%; left:18%;
    width:60%; height:70%;
    background:radial-gradient(ellipse at center,
      rgba(174,196,230,0.55) 0%,
      rgba(60,90,150,0.25) 35%,
      rgba(13,31,71,0) 70%);
    pointer-events:none;
  }
  .dark > *{position:relative;z-index:1;}         /* 中身はグローの上に */
  /* 濃紺上ではプレースホルダ枠を白系に */
  .dark .ph{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.3);color:#ccd;}
  .dark .sec-head .jp::after,
  .dark .sec-head .tick,
  .dark .row .txt .jp::after{background:rgba(255,255,255,0.6);}

  /* DECO-003 セクション見出し(英語ラベル+下線見出し) */
  .sec-head{max-width:1200px;margin:0 auto 40px;padding:0 32px;}
  .sec-head .en{width:80px;height:13px;margin-bottom:14px;}        /* 英語ラベル(小・上) */
  .sec-head .jp{width:240px;height:30px;position:relative;}        /* 和文大見出し */
  .sec-head .jp::after{content:"";position:absolute;left:0;bottom:-8px;width:64px;height:3px;background:#c9ccd1;} /* 下線(左寄せ短め) */
  /* 装飾の斜め線(見出し右下から伸びる細線)を再現 */
  .sec-head .tick{width:40px;height:1px;background:#c9ccd1;transform:rotate(35deg);margin:14px 0 0 200px;}

  /* LAYOUT-003 テキスト左・画像右(交互) */
  .row{max-width:1200px;margin:0 auto 70px;padding:0 32px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
  .row .txt .en{width:70px;height:13px;margin-bottom:12px;}
  .row .txt .jp{width:160px;height:26px;margin-bottom:18px;position:relative;}
  .row .txt .jp::after{content:"";position:absolute;left:0;bottom:-6px;width:50px;height:3px;background:#c9ccd1;}
  .row .txt .p{width:100%;height:12px;margin-bottom:8px;}
  .row .txt .p2{width:80%;height:12px;}
  .row .img{width:100%;height:320px;}
  /* 反転(画像左・テキスト右) */
  .row.rev .txt{order:2;}
  .row.rev .img{order:1;}
</style>
</head>
<body>

  <!-- ===== DECO-004 ===== -->
  <div class="label">DECO-004 / スクロール時に出る固定ヘッダー</div>
  <header class="fixed-header">
    <div class="left">
      <div class="ph logo">LOGO</div>
      <div class="ph lang">JA/EN</div>
    </div>
    <div class="right">
      <div class="ph it">nav</div><div class="ph it">nav</div><div class="ph it">nav</div>
      <div class="ph it">nav</div><div class="ph it">nav</div>
      <div class="ph icon">≡</div><div class="ph icon">⌕</div>
    </div>
  </header>

  <!-- ===== 濃色背景セクション(DECO-003 + LAYOUT-003) ===== -->
  <div class="label">DECO-003 セクション見出し + LAYOUT-003 テキスト左/画像右(交互)</div>
  <div class="dark">

    <!-- セクション見出し(英語ラベル+下線見出し+斜めtick) -->
    <div class="sec-head">
      <div class="ph en">English</div>
      <div class="ph jp">和文大見出し</div>
      <div class="tick"></div>
    </div>

    <!-- row1:テキスト左・画像右 -->
    <div class="row">
      <div class="txt">
        <div class="ph en">label</div>
        <div class="ph jp">小見出し</div>
        <div class="ph p">本文</div>
        <div class="ph p2">本文</div>
      </div>
      <div class="ph img">横長画像</div>
    </div>

    <!-- row2:同じ型を繰り返し(縦に積む) -->
    <div class="row">
      <div class="txt">
        <div class="ph en">label</div>
        <div class="ph jp">小見出し</div>
        <div class="ph p">本文</div>
        <div class="ph p2">本文</div>
      </div>
      <div class="ph img">横長画像</div>
    </div>

  </div>

</body>
</html>
