<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>015 primeNumber 形の骨格</title>
<!--
  形(レイアウト構造)だけのスケルトン。色・テキスト・実画像は除去。
  元URL: https://primenumber.com/
  含む形:
    DECO-022   / 見出しグループ付きドロップダウンナビ(カテゴリ小見出し+項目リスト)
    LAYOUT-016 / ソリッドカラーヒーロー: 左寄せコピー+右の幾何タイル装飾+直下にロゴマーキー帯
  実物: 白ヘッダー(ロゴ左+nav右+右端に塗りCTAボタン)。ヒーローは深緑ベタ1面に
  白の大見出し2行+リード4行を左寄せ、右側〜右下に明度違いの矩形タイルが重なる装飾。
  直下の白帯に導入企業ロゴが1列で流れる(マーキー)。
  ※ 色・画像は構造把握用の仮色/プレースホルダ。
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:sans-serif;color:#555;background:#fff;}
  .ph{background:#e6e6e6;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;text-align:center;}
  .label{max-width:1200px;margin:46px auto 8px;padding:0 32px;font-size:13px;color:#3a6ea5;font-weight:700;}

  /* ===== ヘッダー: ロゴ+nav+塗りCTA ===== */
  .hd{height:76px;background:#fff;border-bottom:1px solid #f0f0f0;
      display:flex;justify-content:space-between;align-items:center;padding:0 0 0 40px;}
  .hd_logo{width:170px;height:30px;}
  .hd_right{display:flex;align-items:center;height:100%;}
  .hd_nav{display:flex;align-items:center;gap:28px;margin-right:28px;}
  .hd_nav .item{width:64px;height:12px;background:#cfcfcf;}
  .hd_nav .item.has-sub{position:relative;}
  .hd_nav .item.has-sub::after{content:"";position:absolute;right:-14px;top:3px;border:4px solid transparent;border-top-color:#999;}
  .hd_cta{height:100%;width:170px;background:#9db8ae;display:flex;align-items:center;justify-content:center;
          font-size:12px;color:#fff;}                     /* 実物: 深緑の塗りボタン(お問い合わせ→) */

  /* ===== DECO-022 見出しグループ付きドロップダウン(開いた状態) ===== */
  .drop{background:#fff;border-bottom:1px solid #eee;box-shadow:0 16px 20px -12px rgba(0,0,0,.12);
        padding:30px 40px 36px;}
  .drop_inner{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}
  .grp .head{width:90px;height:9px;background:#b9c6c0;margin-bottom:16px;}     /* カテゴリ小見出し(英字・薄色) */
  .grp .item{width:150px;height:12px;background:#cfcfcf;margin-bottom:12px;}    /* 項目(製品名など) */
  .grp .item.s{width:110px;}

  /* ===== LAYOUT-016 ソリッドカラーヒーロー+ロゴマーキー ===== */
  .hero{position:relative;background:#9db8ae;height:480px;overflow:hidden;border:1px dashed #8aa398;}
  .hero_copy{position:absolute;left:6%;top:50%;transform:translateY(-50%);}
  .hero_copy .t1{width:400px;height:34px;background:rgba(255,255,255,.85);margin-bottom:14px;}
  .hero_copy .t2{width:340px;height:34px;background:rgba(255,255,255,.85);margin-bottom:26px;}
  .hero_copy .p{width:300px;height:10px;background:rgba(255,255,255,.55);margin-bottom:8px;}
  .hero_copy .p.s{width:250px;}
  /* 右の幾何タイル装飾(明度違いの矩形が重なる) */
  .tile{position:absolute;border:none;}
  .t-a{right:0;top:0;width:28%;height:52%;background:rgba(255,255,255,.18);}
  .t-b{right:14%;top:32%;width:18%;height:44%;background:rgba(255,255,255,.32);}
  .t-c{right:0;bottom:0;width:20%;height:30%;background:rgba(255,255,255,.10);}
  .t-d{right:28%;bottom:0;width:13%;height:26%;background:rgba(255,255,255,.45);}
  /* 直下のロゴマーキー帯 */
  .marquee{background:#fff;border-bottom:1px solid #f0f0f0;padding:26px 0;overflow:hidden;}
  .marquee_track{display:flex;gap:56px;align-items:center;padding:0 20px;}
  .marquee .lg{flex:0 0 110px;height:34px;}               /* 導入企業ロゴ(実物はJSで無限スクロール) */

  @media(max-width:600px){
    .hd_nav{display:none;}
    .hd_cta{width:120px;}
    .drop_inner{grid-template-columns:1fr;gap:24px;}
    .hero{height:400px;}
    .hero_copy .t1{width:80%;}
    .hero_copy .t2{width:64%;}
    .tile{opacity:.6;}
    .marquee .lg{flex-basis:80px;height:26px;}
  }
</style>
</head>
<body>

  <!-- ===== ヘッダー+DECO-022 ===== -->
  <div class="label" style="margin-top:20px;">DECO-022 / 見出しグループ付きドロップダウンナビ(下は開いた状態。カテゴリ小見出し+項目リスト)</div>
  <header>
    <div class="hd">
      <div class="ph hd_logo">ロゴ</div>
      <div class="hd_right">
        <nav class="hd_nav">
          <div class="item has-sub"></div><div class="item"></div><div class="item"></div>
          <div class="item"></div><div class="item"></div>
        </nav>
        <div class="hd_cta">お問い合わせ →</div>
      </div>
    </div>
    <div class="drop">
      <div class="drop_inner">
        <div class="grp"><div class="head"></div><div class="item"></div><div class="item s"></div></div>
        <div class="grp"><div class="head"></div><div class="item"></div></div>
        <div class="grp"><div class="head"></div><div class="item"></div><div class="item s"></div></div>
      </div>
    </div>
  </header>

  <!-- ===== LAYOUT-016 ===== -->
  <div class="label">LAYOUT-016 / ソリッドカラーヒーロー(左コピー+右幾何タイル)+直下ロゴマーキー帯</div>
  <section class="hero">
    <div class="tile t-a"></div>
    <div class="tile t-b"></div>
    <div class="tile t-c"></div>
    <div class="tile t-d"></div>
    <div class="hero_copy">
      <div class="t1"></div>
      <div class="t2"></div>
      <div class="p"></div><div class="p"></div><div class="p"></div><div class="p s"></div>
    </div>
  </section>
  <div class="marquee">
    <div class="marquee_track">
      <div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div>
      <div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div>
      <div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div><div class="ph lg">ロゴ</div>
      <div class="ph lg">ロゴ</div>
    </div>
  </div>

</body>
</html>
