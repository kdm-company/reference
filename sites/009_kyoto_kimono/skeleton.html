<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>009 京都きもの学院 形の骨格</title>
<!--
  形(レイアウト構造)だけのスケルトン。色・テキスト・実画像は除去。
  元URL: https://www.kyoto-kimono.co.jp/
  含む形:
    DECO-015 / 見出し+リード訴求ブロック(キャッチ見出し→長めのリード文を中央寄せで読ませる)
  ※ 色は構造把握用の仮色。
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:serif;color:#555;background:#fff;}
  .ph{background:#e6e6e6;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;text-align:center;}

  /* DECO-015 見出し+リード訴求ブロック */
  .lead{max-width:760px;margin:80px auto;padding:0 32px;text-align:center;}
  .lead .catch{width:60%;max-width:520px;height:28px;background:#cfcfcf;margin:0 auto 32px;}  /* キャッチ見出し */
  .lead .p{width:100%;height:14px;background:#e2e2e2;margin:0 auto 12px;}                       /* リード文(複数行) */
  .lead .p.short{width:70%;}

  @media(max-width:600px){
    .lead{margin:48px auto;}
    .lead .catch{height:22px;width:80%;}
  }
</style>
</head>
<body>

  <section class="lead">
    <div class="ph catch">キャッチ見出し(1行)</div>
    <div class="ph p">リード文</div>
    <div class="ph p">リード文</div>
    <div class="ph p">リード文</div>
    <div class="ph p short">リード文(締め)</div>
  </section>

</body>
</html>
