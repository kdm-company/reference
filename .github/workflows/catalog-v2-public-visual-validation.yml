name: catalog-v2-public-visual-validation

on:
  push:
    branches:
      - test/catalog-v2-public-visual-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-visual-validation:
    name: "公開ページ最終検証"
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@v5

      - name: "Node.jsセットアップ"
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: "依存インストール（既存package-lock.jsonを使用）"
        run: npm ci

      - name: "Chromiumインストール"
        run: npx playwright install --with-deps chromium

      - name: "公開ページ検証テスト実行"
        id: run_tests
        continue-on-error: true
        run: npx playwright test --config=tests/public/playwright.config.js

      - name: "成果物ディレクトリの整理"
        if: always()
        run: |
          mkdir -p artifact-out/catalog-v2-final-visual-check
          cp tests/public/output/catalog-v2-pc-1440.png artifact-out/catalog-v2-final-visual-check/ 2>/dev/null || echo "PCスクリーンショットなし"
          cp tests/public/output/catalog-v2-sp-375.png artifact-out/catalog-v2-final-visual-check/ 2>/dev/null || echo "SPスクリーンショットなし"
          cp tests/public/output/visual-check-report.json artifact-out/catalog-v2-final-visual-check/ 2>/dev/null || echo "JSONレポートなし"
          cp tests/public/output/visual-check-report.md artifact-out/catalog-v2-final-visual-check/ 2>/dev/null || echo "Markdownレポートなし"
          if [ -d tests/public/output/playwright-report ]; then
            cp -r tests/public/output/playwright-report artifact-out/catalog-v2-final-visual-check/playwright-report 2>/dev/null || true
          fi
          cd artifact-out && zip -r catalog-v2-final-visual-check.zip catalog-v2-final-visual-check

      - name: "GITHUB_STEP_SUMMARYへ出力"
        if: always()
        run: |
          if [ -f tests/public/output/visual-check-report.md ]; then
            cat tests/public/output/visual-check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 公開ページ最終検証" >> "$GITHUB_STEP_SUMMARY"
            echo "レポートファイルが生成されませんでした（テストが実行前に異常終了した可能性があります）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Artifactアップロード"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v2-final-visual-check
          path: artifact-out/catalog-v2-final-visual-check
          retention-days: 14

      - name: "テスト結果に応じてジョブを失敗させる"
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
