name: generate-lockfile

# package.json変更時にpackage-lock.jsonを自動生成してコミットする。
# 依存関係の固定（npm ci）のための正本lockfileはCI環境で生成する。

on:
  push:
    paths:
      - "package.json"
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: "package-lock.jsonの生成"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: "lockfile生成"
        run: npm install --package-lock-only
      - name: "変更があればコミット"
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: package-lock.json をCIで自動生成"
          git push
